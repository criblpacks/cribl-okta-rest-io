in_okta_api:
  type: collection
  ttl: 4h
  ignoreGroupJobsLimit: false
  removeFields: []
  resumeOnBoot: false
  schedule:
    cronSchedule: "*/5 * * * *"
    maxConcurrentRuns: 1
    skippable: true
    run:
      rescheduleDroppedTasks: true
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 60m
      mode: run
      timeRangeType: relative
      timeWarning: {}
      expression: "true"
      minTaskSize: 1MB
      maxTaskSize: 10MB
      stateTracking:
        stateUpdateExpression: "__timestampExtracted !== false && {latestTime:
          (state.latestTime || 0) > _time ? state.latestTime : _time}"
        stateMergeExpression: "(prevState.latestTime || 0) > newState.latestTime ?
          prevState : newState"
        enabled: true
    enabled: true
  streamtags: []
  workerAffinity: false
  collector:
    conf:
      discovery:
        discoverType: none
      collectMethod: get
      pagination:
        type: response_header_link
        nextRelationAttribute: next
        maxPages: 0
        curRelationAttribute: self
      authentication: none
      timeout: 0
      useRoundRobinDns: false
      disableTimeFilter: false
      decodeUrl: true
      rejectUnauthorized: false
      captureHeaders: false
      stopOnEmptyResults: false
      safeHeaders: []
      retryRules:
        type: backoff
        interval: 1000
        limit: 5
        multiplier: 2
        maxIntervalMs: 20000
        codes:
          - 429
          - 503
        enableHeader: true
        retryConnectTimeout: false
        retryConnectReset: false
        retryHeaderName: retry-after
      __scheduling:
        stateTracking: {}
      collectUrl: "`https://${C.vars['okta_domain']}.okta.com/api/v1/logs`"
      collectRequestParams:
        - name: since
          value: "`${new Date((state.latestTime * 1000 ||
            Date.now()-(7*24*60*60*1000))).toISOString()}`"
        - name: until
          value: "`${new Date((latest * 1000 || Date.now())).toISOString()}`"
      collectRequestHeaders:
        - name: Authorization
          value: "#42:WQn3KCyZMlWSEbb7x6t5N4ON78ts2fhNYBE3Pn6BK/fyxuEeHH5DjTg58/llUxrz"
    destructive: false
    type: rest
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: "0"
    breakerRulesets:
      - Okta API Ruleset
    metadata:
      - name: __packsource
        value: "'cribl-okta-rest-io.okta-api-logs'"
  savedState: {}
  notifications: []
